[package]
name = "nvxd-guest"
version = "0.1.0"
edition = "2024"
# The minimum supported Rust version of `nvx`, which a test keeps equal.
rust-version = "1.89"
description = "The sidecar's guest agent and host framing, built on the nvx crate; a fork-owned copy of upstream's tests/runtime-adapter with the sidecar's additions"
license = "MIT"
repository = "https://github.com/microsoft/nvx"
readme = "README.md"
publish = false

# The library keeps upstream's crate name so the copied sources stay identical to tests/runtime-adapter
# (apart from the additions listed in README.md) and upstream changes can be carried over by diff.
[lib]
name = "runtime_adapter"

[features]
# No default features: each configuration selects one side of `nvx`, as an independent adapter
# does. Without features, the adapter builds against the protocol-only `nvx`.
default = []
# The host program: the host API of `nvx` and the `runtime-adapter-host` binary.
host = ["nvx/host", "dep:serde_json"]
# The guest agent: the guest API of `nvx` and the `runtime-adapter-guest` binary, which builds as a
# static `x86_64-unknown-linux-musl` executable.
guest = ["nvx/guest", "dep:nix"]

[dependencies]
nvx = { path = "../../nvx-rs", default-features = false }
# The host program records each launch in the sandbox's store as JSON, with the persisted form of
# its plan. The host side of `nvx` depends on the same release.
serde_json = { version = "1.0.120", optional = true }

# The guest agent's PID 1 collects the status of every child and ends the unrelated one, its
# worker polls its nonblocking session and executions, its probes read how much space a file
# system has, its mapping probes mount a procfs in the root, and
# the helper of its `entries` probe enters a mount namespace of its own and leaks a descriptor to
# its executions, which open raw sockets: system calls that `nvx` leaves to the caller. The guest
# side of `nvx` depends on the same release, with these features among its own.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = [
    "fs",
    "mount",
    "poll",
    "process",
    "sched",
    "signal",
    "socket",
], optional = true }

# The guest agent's tests open pseudo-terminals, and trace a child. The guest side of `nvx`
# depends on the same release, with `term` among its own features.
[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["ptrace", "term"] }

# The binary has no unit tests.
[[bin]]
name = "nvxd-guest"
path = "src/bin/nvxd-guest.rs"
required-features = ["guest"]
test = false

[lints.rust]
missing_docs = "warn"
# The adapter reaches `nvx` through its public API alone.
unsafe_code = "forbid"
unreachable_pub = "warn"
