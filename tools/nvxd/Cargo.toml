[package]
name = "nvxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "PoC sidecar: drives NVX microVM sandboxes for a sandbox host over stdio frames"
publish = false

[dependencies]
# The crate lives in the same NVX fork, so the dependency stays repo-relative
# and a clean checkout builds without any absolute development path.
aci_edge_sandboxes = { path = "../../aci_edge_sandboxes", default-features = false, features = ["openvmm"] }
serde_json = "1.0.120"

[profile.release]
panic = "abort"
