[package]
name = "nvxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Sidecar that drives NVX microVM sandboxes for a sandbox host over stdio frames"
publish = false

[dependencies]
# The sidecar is an adapter of the NVX runtime, built on the `nvx` crate like
# tests/runtime-adapter: path dependencies, default features off.
nvx = { path = "../../nvx-rs", default-features = false, features = ["host"] }
# Until the sidecar has a guest agent and host framing of its own, it reuses the runtime
# adapter's: the control framing, the root configuration, and the execution messages.
runtime-adapter = { path = "../../tests/runtime-adapter", default-features = false, features = ["host"] }
serde_json = "1.0.120"
sha2 = "0.10"

[profile.release]
panic = "abort"
