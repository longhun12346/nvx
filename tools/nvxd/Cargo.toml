# STATUS: does not build. The aci_edge_sandboxes crate below was removed upstream (it is not in
# this tree any more), so nothing builds or tests this crate, including the fork workflows
# (the sidecar job in .github/workflows/fork-ci.yml is switched off). The sidecar is being
# ported onto the `nvx` library in nvx-rs; until then this file only records what it needs.
# The sources of the removed control client are in reference/ for the port.

[package]
name = "nvxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "PoC sidecar: drives NVX microVM sandboxes for a sandbox host over stdio frames"
publish = false

[dependencies]
# The crate lives in the same NVX fork, so the dependency stays repo-relative
# and a clean checkout builds without any absolute development path.
aci_edge_sandboxes = { path = "../../aci_edge_sandboxes", default-features = false, features = ["openvmm"] }
serde_json = "1.0.120"

[profile.release]
panic = "abort"
